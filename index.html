<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country-Explorer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <h1 id="logo">Country Explorer</h1>
      <div id="nav_data">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <a href="#help">Help</a>
      </div>
    </nav>

    <header>
      <input type="text" id="search" placeholder="Search for a country..." />
      <select id="findContinent">
        <option value="default">Find By Continent</option>
        <option value="North America">North America</option>
        <option value="South America">South America</option>
        <option value="Asia">Asia</option>
        <option value="Europe">Europe</option>
        <option value="Africa">Africa</option>
        <option value="Antarctica">Antarctica</option>
      </select>
    </header>

    <main id="countries-container"></main>

    <!-- Modal for country details -->
    <div id="modal" class="modal" style="display: none">
        <div class="modal-content">
          <span id="close-modal-button" class="close-button">&times;</span>
          <h2 id="modal-country-name"></h2>
          <img id="modal-country-flag" src="" alt="Country flag" />
          <p>Population: <span id="modal-country-population"></span></p>
          <p>Area: <span id="modal-country-area"></span></p>
          <p>Google Maps: <span id="modal-country-language"></span></p>
          <p>Description: <span id="modal-country-description"></span></p>
        </div>
      </div>

    <footer>
      <p>&copy;2024 Countries Information || All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
